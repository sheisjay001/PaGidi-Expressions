services:
  - type: web
    name: pagidi-expressions
    env: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: pagidi-blog-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: pagidi-blog-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: pagidi-blog-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: pagidi-blog-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: pagidi-blog-db
          property: port
      - key: DB_TYPE
        value: pgsql
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SITE_URL
        value: https://pagidi-expressions.onrender.com

databases:
  - name: pagidi-blog-db
    databaseName: pagidi_blog
    user: postgres
