services:
  - type: web
    name: pagidi-expressions
    env: php
    buildCommand: echo "No build needed"
    startCommand: php -S 0.0.0.0:$PORT -t .
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        value: localhost
      - key: DB_NAME
        value: pagidi_blog
      - key: DB_USER
        value: postgres
      - key: DB_PASS
        generateValue: true
      - key: DB_PORT
        value: 5432
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SITE_URL
        value: https://pagidi-expressions.onrender.com

databases:
  - name: pagidi-blog-db
    databaseName: pagidi_blog
    user: postgres
